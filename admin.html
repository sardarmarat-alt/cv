<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chat admin</title>
<style>
:root{--bg:#eef2fb;--card:rgba(255,255,255,.6);--edge:rgba(255,255,255,.85);--text:#14192b;--muted:#4c5672;--accent:#1f4fd8;--onacc:#fff;--shadow:rgba(40,60,120,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--card:rgba(255,255,255,.08);--edge:rgba(255,255,255,.2);--text:#eef1fa;--muted:#a3adc7;--accent:#8fb0ff;--onacc:#0a0f1e;--shadow:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);border-radius:18px;box-shadow:0 8px 28px var(--shadow)}
.wrap{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 24px}
input,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--text);font:inherit;outline:none;margin-bottom:10px}
button{border:0;background:var(--accent);color:var(--onacc);padding:10px 18px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--edge)}
#login{max-width:340px;margin:18vh auto;padding:24px}
#app{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cols{display:grid;grid-template-columns:260px 1fr;gap:12px;height:calc(100vh - 110px)}
@media (max-width:700px){.cols{grid-template-columns:1fr;height:auto}#conv{min-height:60vh}}
#threads{overflow-y:auto;padding:8px}
.th{padding:10px 12px;border-radius:12px;cursor:pointer}
.th:hover,.th.on{background:var(--card);outline:1px solid var(--edge)}
.th b{display:block}.th small{color:var(--muted)}
#conv{display:flex;flex-direction:column;overflow:hidden}
#chead{padding:12px 16px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:8px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:8px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.bub.owner{align-self:flex-end;background:var(--accent);color:var(--onacc)}
.bub.visitor{align-self:flex-start;background:var(--card);border:1px solid var(--edge)}
#reply{display:flex;gap:8px;padding:12px;border-top:1px solid var(--edge)}
#reply textarea{margin:0;height:44px;resize:none}
.muted{color:var(--muted);text-align:center;margin:auto}
#err{color:#d33;min-height:1.2em;margin:0}
</style>
</head>
<body>
<div class="wrap">
<form id="login" class="box">
<h2 style="margin-top:0">Chat admin</h2>
<input id="em" type="email" placeholder="Email" required autocomplete="username">
<input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
<button type="submit" style="width:100%">Log in</button>
<p id="err"></p>
</form>
<div id="app">
<div class="top"><h2 style="margin:0">Conversations</h2><button class="ghost" id="out">Log out</button></div>
<div class="cols">
<div id="threads" class="box"></div>
<div id="conv" class="box">
<div id="chead"><strong id="who">Select a conversation</strong><button class="ghost" id="del" style="display:none">Delete</button></div>
<div id="msgs"><div class="muted">No conversation selected</div></div>
<form id="reply" style="display:none"><textarea id="rtext" placeholder="Write a reply…" maxlength="1000" required></textarea><button type="submit">Send</button></form>
</div>
</div>
</div>
</div>
<script>
var SUPABASE_URL='https://jdxrdxdpdmamxrnxbpmj.supabase.co';
var SUPABASE_KEY='sb_publishable_5YZmaQplMGV8sf92P11OOw_S5gESGem';
var tok=null,cur=null,curName='',timer=null,lastCount=-1;
try{tok=sessionStorage.getItem('adm_tok')}catch(e){}
var $=function(i){return document.getElementById(i)};
function api(path,opts){opts=opts||{};opts.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},opts.headers||{});
return fetch(SUPABASE_URL+'/rest/v1/'+path,opts).then(function(r){if(r.status===401){logout();throw new Error('auth')}return r})}
function show(){$('login').style.display=tok?'none':'block';$('app').style.display=tok?'block':'none'}
function logout(){tok=null;try{sessionStorage.removeItem('adm_tok')}catch(e){}clearInterval(timer);show()}
$('out').onclick=logout;
$('login').onsubmit=function(e){e.preventDefault();$('err').textContent='';
fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})})
.then(function(r){return r.json()}).then(function(d){
if(!d.access_token){$('err').textContent='Wrong email or password.';return}
tok=d.access_token;try{sessionStorage.setItem('adm_tok',tok)}catch(e){}
$('pw').value='';start()}).catch(function(){$('err').textContent='Connection problem.'})};
function fmt(t){var d=new Date(t);return d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function loadThreads(){return api('chat_threads?select=id,name,email,last_message_at&order=last_message_at.desc').then(function(r){return r.json()}).then(function(list){
var box=$('threads');box.innerHTML='';
if(!list.length){var m=document.createElement('div');m.className='muted';m.textContent='No messages yet';box.appendChild(m);return}
list.forEach(function(t){var d=document.createElement('div');d.className='th'+(t.id===cur?' on':'');
var b=document.createElement('b');b.textContent=t.name;var s=document.createElement('small');s.textContent=(t.email?t.email+' · ':'')+fmt(t.last_message_at);
d.appendChild(b);d.appendChild(s);d.onclick=function(){open(t)};box.appendChild(d)})}).catch(function(){})}
function open(t){cur=t.id;curName=t.name+(t.email?' · '+t.email:'');lastCount=-1;$('who').textContent=curName;$('del').style.display='inline-block';$('reply').style.display='flex';loadMsgs();loadThreads()}
function loadMsgs(){if(!cur)return;api('chat_messages?thread_id=eq.'+cur+'&select=sender,body,created_at&order=id.asc').then(function(r){return r.json()}).then(function(l){
if(l.length===lastCount)return;lastCount=l.length;var box=$('msgs');box.innerHTML='';
l.forEach(function(m){var b=document.createElement('div');b.className='bub '+m.sender;b.textContent=m.body;b.title=fmt(m.created_at);box.appendChild(b)});box.scrollTop=box.scrollHeight}).catch(function(){})}
$('reply').onsubmit=function(e){e.preventDefault();var t=$('rtext').value.trim();if(!t||!cur)return;
api('chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({thread_id:cur,sender:'owner',body:t})}).then(function(r){if(r.ok){$('rtext').value='';lastCount=-1;loadMsgs();loadThreads()}else alert('Could not send.')}).catch(function(){})};
$('rtext').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('reply').requestSubmit()}});
$('del').onclick=function(){if(!cur||!confirm('Delete this conversation for good?'))return;
api('chat_threads?id=eq.'+cur,{method:'DELETE'}).then(function(){cur=null;$('who').textContent='Select a conversation';$('del').style.display='none';$('reply').style.display='none';$('msgs').innerHTML='<div class="muted">No conversation selected</div>';loadThreads()}).catch(function(){})};
function start(){show();loadThreads();clearInterval(timer);timer=setInterval(function(){loadThreads();loadMsgs()},5000)}
show();if(tok)start();
</script>
</body>
</html>
